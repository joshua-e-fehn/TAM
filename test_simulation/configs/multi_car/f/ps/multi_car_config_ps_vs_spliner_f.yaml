# Multi-Car Test Configuration
# Two cars racing against each other
# Tests different planner matchups and speed configurations

test_matrix:
  - simulation_id: "mult_0001"
    name: "spliner_vs_spliner"
    mode: "multi_car"
    planner_car1: "predictive_spliner"
    planner_car2: "spliner"
    speed_multiplier_car1: 1.0
    accel_multiplier_car1: 1.0
    global_map: "f_100%s_100%w_NUC2_mintime"
    show_simulation_output: false
    use_global_prediction: false

    car1_predictive_spliner_lookahead_dist: 20.0
    car1_predictive_spliner_max_v: 10.0
    car1_predictive_spliner_min_v: 1.0
    car1_predictive_spliner_max_a: 3.0
    car1_predictive_spliner_min_a: 0.0
    car1_predictive_spliner_max_expire_counter: 15

    car1_predictive_spliner_spline_bound_mindist: 0.15
    car1_predictive_spliner_evasion_dist: 1.0
    car1_predictive_spliner_back_to_raceline_before: 6.0
    car1_predictive_spliner_back_to_raceline_after: 11.0
    car1_predictive_spliner_save_distance_front: 0.6
    car1_predictive_spliner_save_distance_back: 0.6

    car2_spliner_spline_bound_mindist: 0.3
    car2_spliner_evasion_dist: 0.925
    car2_spliner_pre_apex_dist0: 4
    car2_spliner_pre_apex_dist1: 3
    car2_spliner_pre_apex_dist2: 2
    car2_spliner_post_apex_dist0: 4
    car2_spliner_post_apex_dist1: 5
