# Single Car With Obstacle Test Configuration
# Car vs dummy obstacle mode - tests overtaking and avoidance
# Tests different planners vs various obstacle speeds

test_matrix:
  - simulation_id: "scwo_0001"
    name: "single_vs_obstacle_predictive_spliner"
    mode: "single_car_obstacle"
    planner: "predictive_spliner"
    global_map: "f"
    obstacle_speed: 0.57
    obstacle_start_s: 33
    show_simulation_output: false
    use_global_prediction: true

    predictive_spliner_spline_bound_mindist: 0.15
    predictive_spliner_lookahead_dist: 20.0
    predictive_spliner_max_v: 10.0
    predictive_spliner_min_v: 1.0
    predictive_spliner_max_a: 3.0
    predictive_spliner_min_a: 0.0
    predictive_spliner_max_expire_counter: 15

    predictive_spliner_evasion_dist: 1.25
    predictive_spliner_back_to_raceline_before: 5.0
    predictive_spliner_back_to_raceline_after: 8.0
    predictive_spliner_save_distance_front: 0.6
    predictive_spliner_save_distance_back: 0.6

