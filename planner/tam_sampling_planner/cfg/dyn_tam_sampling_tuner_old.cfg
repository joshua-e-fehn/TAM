#!/usr/bin/env python3
"""
Dynamic reconfigure configuration for TAM Sampling Planner
Defines tunable parameters for real-time adjustment
"""

PACKAGE = "tam_sampling_planner"

from dynamic_reconfigure.parameter_generator_catkin import *

gen = ParameterGenerator()

# Sampling parameters
gen.add("lateral_samples", int_t, 0, "Number of lateral trajectory samples", 15, 5, 25)
gen.add("longitudinal_samples", int_t, 0, "Number of longitudinal velocity profiles", 8, 3, 15)
gen.add("planning_horizon", double_t, 0, "Planning horizon in seconds", 4.0, 1.0, 8.0)

# Vehicle constraints
gen.add("max_speed", double_t, 0, "Maximum vehicle speed (m/s)", 20.0, 5.0, 30.0)
gen.add("max_accel", double_t, 0, "Maximum acceleration (m/s²)", 8.0, 2.0, 15.0)
gen.add("max_lateral_accel", double_t, 0, "Maximum lateral acceleration (m/s²)", 12.0, 5.0, 20.0)

# Cost function weights (following TAM naming)
gen.add("raceline_cost_weight", double_t, 0, "Raceline deviation cost weight", 3.5, 0.0, 10.0)
gen.add("velocity_cost_weight", double_t, 0, "Velocity cost weight", 3.0, 0.0, 10.0)
gen.add("smoothness_cost_weight", double_t, 0, "Trajectory smoothness cost weight", 1.0, 0.0, 5.0)
gen.add("obstacle_cost_weight", double_t, 0, "Obstacle avoidance cost weight", 10000.0, 1000.0, 50000.0)
gen.add("lateral_jerk_cost_weight", double_t, 0, "Lateral jerk cost weight", 0.5, 0.0, 2.0)

# Safety parameters
gen.add("safety_margin_static", double_t, 0, "Safety margin for static obstacles (m)", 0.5, 0.1, 2.0)
gen.add("safety_margin_dynamic", double_t, 0, "Safety margin for dynamic obstacles (m)", 1.0, 0.2, 3.0)

# Advanced parameters
gen.add("track_width", double_t, 0, "Usable track width (m)", 3.0, 1.0, 6.0)
gen.add("dt", double_t, 0, "Time discretization step (s)", 0.1, 0.05, 0.2)

exit(gen.generate(PACKAGE, "tam_sampling_planner", "tam_sampling_tuner"))
