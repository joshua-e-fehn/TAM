#!/usr/bin/env python3
# Complete TAM Sampling Planner Dynamic Reconfigure Configuration
# Based on original TAM parameters for comprehensive real-time tuning

PACKAGE = "tam_sampling_planner"

from dynamic_reconfigure.parameter_generator_catkin import *

gen = ParameterGenerator()

# ========================================
# Core Sampling Parameters
# ========================================
sampling_group = gen.add_group("Sampling Parameters")

sampling_group.add("lateral_samples", int_t, 0, 
                  "Number of lateral trajectory samples", 15, 5, 25)
sampling_group.add("longitudinal_samples", int_t, 0,
                  "Number of longitudinal velocity profiles", 8, 3, 15)
sampling_group.add("n_dense_samples", int_t, 0,
                  "Number of dense samples around raceline", 5, 1, 10)
sampling_group.add("planning_horizon", double_t, 0,
                  "Planning time horizon (seconds)", 4.0, 1.0, 8.0)

# ========================================
# Vehicle Constraints
# ========================================
vehicle_group = gen.add_group("Vehicle Constraints")

vehicle_group.add("max_speed", double_t, 0,
                 "Maximum vehicle speed (m/s)", 20.0, 5.0, 30.0)
vehicle_group.add("max_accel", double_t, 0,
                 "Maximum longitudinal acceleration (m/s²)", 8.0, 3.0, 15.0)
vehicle_group.add("max_lateral_accel", double_t, 0,
                 "Maximum lateral acceleration (m/s²)", 12.0, 5.0, 20.0)

# ========================================
# Longitudinal Sampling Parameters
# ========================================
long_group = gen.add_group("Longitudinal Sampling")

long_group.add("s_dot_discretization", double_t, 0,
              "Velocity discretization step (m/s)", 2.0, 0.5, 5.0)
long_group.add("v_sampling_scale", double_t, 0,
              "Velocity sampling scale factor", 1.1, 1.0, 1.3)
long_group.add("s_dot_max_positive_delta", double_t, 0,
              "Max positive velocity change (m/s)", 20.0, 5.0, 30.0)
long_group.add("relative_s_dot_min_percentage", double_t, 0,
              "Relative minimum velocity percentage", 0.5, 0.1, 0.9)

# ========================================
# Cost Function Weights (TAM Defaults)
# ========================================
cost_group = gen.add_group("Cost Function Weights")

cost_group.add("raceline_cost_weight", double_t, 0,
              "Raceline following cost weight", 3.5, 0.0, 10.0)
cost_group.add("velocity_cost_weight", double_t, 0,
              "Velocity optimization cost weight", 3.0, 0.0, 10.0)
cost_group.add("friction_cost_weight", double_t, 0,
              "Friction constraint cost weight", 5000.0, 1000.0, 10000.0)
cost_group.add("curvature_cost_weight", double_t, 0,
              "Curvature penalty cost weight", 500000.0, 100000.0, 1000000.0)
cost_group.add("lateral_jerk_cost_weight", double_t, 0,
              "Lateral jerk comfort cost weight", 0.5, 0.0, 2.0)
cost_group.add("prediction_cost_weight", double_t, 0,
              "Obstacle prediction cost weight", 100000.0, 10000.0, 500000.0)
cost_group.add("collision_cost_weight", double_t, 0,
              "Collision avoidance cost weight", 100000000.0, 1000000.0, 500000000.0)

# ========================================
# Safety Parameters
# ========================================
safety_group = gen.add_group("Safety Parameters")

safety_group.add("safety_distance_track_left", double_t, 0,
                "Safety distance to left track boundary (m)", 0.5, 0.1, 1.5)
safety_group.add("safety_distance_track_right", double_t, 0,
                "Safety distance to right track boundary (m)", 0.5, 0.1, 1.5)
safety_group.add("safety_margin_static", double_t, 0,
                "Safety margin for static obstacles (m)", 0.5, 0.1, 2.0)
safety_group.add("safety_margin_dynamic", double_t, 0,
                "Safety margin for dynamic obstacles (m)", 1.0, 0.3, 2.5)
safety_group.add("tube_width", double_t, 0,
                "Trajectory tube width (m)", 1.0, 0.3, 2.0)

# ========================================
# Trajectory Validation Parameters
# ========================================
validation_group = gen.add_group("Trajectory Validation")

validation_group.add("kappa_thr", double_t, 0,
                    "Maximum allowed curvature (1/m)", 0.1, 0.05, 0.5)
validation_group.add("curvature_cost_threshold", double_t, 0,
                    "Curvature threshold for cost penalty", 30.0, 10.0, 100.0)

# ========================================
# Lateral Sampling Parameters
# ========================================
lateral_group = gen.add_group("Lateral Sampling")

lateral_group.add("n_dense_min", double_t, 0,
                 "Minimum lateral offset for dense sampling (m)", -0.5, -1.5, 0.0)
lateral_group.add("n_dense_max", double_t, 0,
                 "Maximum lateral offset for dense sampling (m)", 0.5, 0.0, 1.5)
lateral_group.add("track_width", double_t, 0,
                 "Effective track width for sampling (m)", 3.0, 2.0, 5.0)

# ========================================
# Behavior Parameters
# ========================================
behavior_group = gen.add_group("Behavior Parameters")

behavior_group.add("increasing_rl_cost", bool_t, 0,
                  "Enable increasing raceline cost over time", True)

exit(gen.generate(PACKAGE, "tam_sampling_planner", "TAMSamplingTuner"))
