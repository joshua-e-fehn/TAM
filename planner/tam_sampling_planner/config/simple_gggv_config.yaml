# Simple GGGV Configuration for TAM Sampling Planner
# This file contains conservative acceleration limits for use when real GGGV data is not available

# IMPORTANT: These are CONSERVATIVE estimates for a high-performance racing car
# You should tune these values based on your specific vehicle characteristics

# =============================================================================
# ACCELERATION LIMITS [m/s²]
# =============================================================================

# Maximum longitudinal acceleration (forward)
# Typical values:
#   - Road car: 3-5 m/s²
#   - Sports car: 5-8 m/s²  
#   - Formula car: 8-12 m/s²
#   - F1 car: 10-15 m/s²
max_longitudinal_accel: 8.0

# Maximum longitudinal deceleration (braking) 
# Note: This is a NEGATIVE value
# Typical values:
#   - Road car: -5 to -8 m/s²
#   - Sports car: -8 to -12 m/s²
#   - Formula car: -12 to -18 m/s²
#   - F1 car: -15 to -20 m/s²
max_longitudinal_decel: -12.0

# Maximum lateral acceleration (cornering)
# Typical values:
#   - Road car: 5-8 m/s²
#   - Sports car: 8-12 m/s²
#   - Formula car: 12-18 m/s²
#   - F1 car: 15-25 m/s²
max_lateral_accel: 15.0

# =============================================================================
# MACHINE LIMITS (Engine/Brake Power Limitations)
# =============================================================================

# These represent the maximum acceleration available from the powertrain
# as a function of speed. Values decrease at higher speeds due to:
# - Engine power curve
# - Aerodynamic drag
# - Transmission gearing

# Speed breakpoints [m/s]: [0, 6.7, 13.3, 20, 26.7, 33.3, 40, 46.7, 53.3, 60]
# Corresponding acceleration limits [m/s²]:
ax_machine_limits: [8.0, 7.5, 7.0, 6.5, 6.0, 5.5, 5.0, 4.5, 4.0, 3.5]

# =============================================================================
# VELOCITY-DEPENDENT SCALING
# =============================================================================

# Speed points for scaling factors [m/s]
velocity_breakpoints: [0, 5, 10, 15, 20, 25, 30, 40, 50, 60]

# Acceleration scaling factors at each speed point
# 1.0 = full capability, <1.0 = reduced capability
# This accounts for:
# - Tire performance degradation at high speeds
# - Aerodynamic effects
# - Vehicle stability considerations
accel_scale_factors: [0.8, 0.9, 1.0, 1.0, 0.98, 0.95, 0.9, 0.8, 0.7, 0.6]

# =============================================================================
# G-G DIAGRAM SHAPE PARAMETERS
# =============================================================================

# These control the shape of the acceleration envelope
# Higher values = more "square" envelope
# Lower values = more "rounded" envelope
# Typical range: 1.5 - 3.0

gg_exponent_ax_pos: 2.0  # Positive acceleration envelope shape
gg_exponent_ax_neg: 2.0  # Negative acceleration envelope shape

# =============================================================================
# GRIP/FRICTION PARAMETERS
# =============================================================================

# Default friction coefficient
# Typical values:
#   - Dry asphalt: 0.7-1.0
#   - Racing slicks on dry track: 1.0-1.4
#   - Wet conditions: 0.3-0.7
default_friction_coefficient: 1.0

# =============================================================================
# TUNING GUIDELINES
# =============================================================================

# To tune these parameters for your vehicle:

# 1. START CONSERVATIVE
#    Begin with lower values and gradually increase

# 2. OBSERVE VEHICLE BEHAVIOR
#    - If trajectories are too slow/cautious: increase limits
#    - If vehicle is unstable/sliding: decrease limits

# 3. TEST INCREMENTALLY
#    - Change one parameter at a time
#    - Test at different speeds and scenarios

# 4. VALIDATE WITH REAL DATA
#    - Record actual accelerations during driving
#    - Compare with these limits
#    - Adjust parameters accordingly

# 5. SAFETY MARGINS
#    - Keep limits 10-20% below absolute maximum
#    - Account for tire wear, fuel load, temperature effects

# =============================================================================
# VEHICLE-SPECIFIC EXAMPLES
# =============================================================================

# Example for F1/10 Scale Car (1:10 scale):
# max_longitudinal_accel: 4.0
# max_longitudinal_decel: -6.0  
# max_lateral_accel: 8.0

# Example for Go-Kart:
# max_longitudinal_accel: 5.0
# max_longitudinal_decel: -8.0
# max_lateral_accel: 10.0

# Example for Road Car:
# max_longitudinal_accel: 4.0
# max_longitudinal_decel: -7.0
# max_lateral_accel: 7.0

# Example for High-Performance Sports Car:
# max_longitudinal_accel: 6.0
# max_longitudinal_decel: -10.0
# max_lateral_accel: 12.0
