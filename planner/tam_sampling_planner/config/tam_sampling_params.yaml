# Complete TAM Sampling Planner Configuration
# Based on original TAM parameters for optimal racing performance

# ========================================
# Core Sampling Parameters
# ========================================
lateral_samples: 15              # Number of lateral trajectory samples
longitudinal_samples: 8          # Number of longitudinal velocity profiles  
n_dense_samples: 5               # Dense samples around raceline
n_dense_min: -0.5               # Minimum lateral offset for dense sampling (m)
n_dense_max: 0.5                # Maximum lateral offset for dense sampling (m)
planning_horizon: 4.0           # Planning time horizon (seconds)
dt: 0.1                         # Time discretization step (seconds)

# ========================================
# Vehicle Constraints (F1TENTH defaults)
# ========================================
max_speed: 10.0                 # Maximum vehicle speed (m/s)
max_accel: 3.0                  # Maximum longitudinal acceleration (m/s²)
max_lateral_accel: 12.0         # Maximum lateral acceleration (m/s²)                   ?????
track_width: 3.0                # Effective track width for sampling (m)                !!!!!

# ========================================
# Longitudinal Sampling Parameters
# ========================================
s_dot_end_min: 1.0              # Minimum end velocity (m/s)
s_dot_discretization: 2.0       # Velocity discretization step (m/s)
s_dot_max_positive_delta: 20.0  # Max positive velocity change (m/s)
v_sampling_scale: 1.1           # Velocity sampling scale factor
relative_s_dot_min_percentage: 0.5  # Relative minimum velocity percentage

# Dense velocity sampling around current velocity
s_dot_dense_min: -4.0           # Minimum dense velocity offset (m/s)
s_dot_dense_max: 1.0            # Maximum dense velocity offset (m/s)
s_dot_dense_samples: 10         # Number of dense velocity samples

# Forward/backward velocity sampling for adaptive acceleration limits
forward_backward_max_v_to_rl_delta: 0.0  # Max velocity delta to raceline for forward/backward sampling

# ========================================
# Cost Function Weights (TAM Defaults)
# ========================================
# Primary cost weights
raceline_cost_weight: 3.5       # Raceline following cost weight
velocity_cost_weight: 3.0       # Velocity optimization cost weight
friction_cost_weight: 5000.0    # Friction constraint cost weight
curvature_cost_weight: 500000.0 # Curvature penalty cost weight
lateral_jerk_cost_weight: 0.5   # Lateral jerk comfort cost weight

# Obstacle avoidance costs
prediction_cost_weight: 100000.0     # Obstacle prediction cost weight
collision_cost_weight: 100000000.0   # Collision avoidance cost weight
additional_absolute_sample_cost: 50.0  # Additional absolute sample cost

# Overtaking behavior weights (for multi-car scenarios)
raceline_cost_weight_overtaking: 2.0      # Raceline cost during overtaking
velocity_cost_weight_overtaking: 8.0      # Velocity cost during overtaking
lateral_jerk_cost_weight_overtaking: 0.0  # Lateral jerk cost during overtaking

# ========================================
# Safety Parameters
# ========================================
# Track boundary safety distances (F1TENTH: reduced for 1/10 scale racing)
safety_distance_track_left: 0.02   # Safety distance to left track boundary (m) - F1TENTH: 2cm
safety_distance_track_right: 0.02  # Safety distance to right track boundary (m) - F1TENTH: 2cm

# Pitlane safety distances (for pit entry/exit scenarios)
safety_distance_pitlane_left: 0.0  # Safety distance to left pitlane boundary (m)
safety_distance_pitlane_right: 0.0 # Safety distance to right pitlane boundary (m)

# Soft safety distances (for cost penalties rather than hard constraints)
soft_safety_distance_left_m: 0.0   # Soft safety distance left (m)
soft_safety_distance_right_m: 0.0  # Soft safety distance right (m)

# Obstacle safety margins
safety_margin_static: 0.2          # Safety margin for static obstacles (m)
safety_margin_dynamic: 0.5         # Safety margin for dynamic obstacles (m)
safety_distance_vehicles: 0.5      # Additional inter-vehicle safety distance (m)

# Tube and lane parameters (F1TENTH: reduced from 1.0m to fit narrower tracks)
tube_width: 0.05                   # Trajectory tube width (m) - F1TENTH: 5cm soft margin

# Emergency safety distances
add_emergency_safety_distance_left: 0.3   # Extra emergency safety left (m)
add_emergency_safety_distance_right: 0.3  # Extra emergency safety right (m)

# ========================================
# Trajectory Validation Parameters
# ========================================
# Safety and Constraint Parameters
kappa_thr: 1.5                     # Maximum allowed curvature (rad/m) - F1TENTH: 1.5 allows R_min ≈ 0.67m (kinematic limit)
curvature_cost_threshold: 30.0     # Curvature threshold for cost penalty
tire_util_max_check: 1.1           # Maximum tire utilization check

# ========================================
# Cost Behavior Parameters
# ========================================
increasing_rl_cost: true           # Enable increasing raceline cost over time
velocity_excess_cost_multiplier: 2.0   # Velocity excess cost multiplier
V_diff_max_costs: 15.0             # Maximum velocity difference for costs

# ========================================
# Collision and Prediction Parameters
# ========================================
collision_check_horizon_s: 1.5     # Collision check horizon (s-coordinate)

# Prediction scaling factors
prediction_s_factor_min_size: 0.03      # Prediction s factor minimum size
prediction_s_factor_max_size: 0.012     # Prediction s factor maximum size
prediction_s_asym_scaling: 1.5          # Prediction s asymmetric scaling
prediction_n_factor: 0.2                # Prediction n factor
prediction_uncertainty_weight: 4.0      # Prediction uncertainty weight

# Prediction factors for different object types
prediction_s_factor_defender: 0.03      # Prediction s factor for defender
prediction_n_factor_defender: 0.2       # Prediction n factor for defender
prediction_s_factor_static: 0.05        # Prediction s factor for static objects
prediction_n_factor_static: 0.35        # Prediction n factor for static objects

# ========================================
# Trajectory Generation Parameters
# ========================================
num_samples: 51                         # Number of trajectory points
min_trajectory_length: 10.0             # Minimum trajectory length (m)
const_trajectory_time: 0.00              # Constant trajectory time (s)

# Extension parameters for emergency trajectories
extension_emergency_time_offset: 1.0    # Extension emergency time offset (s)
extension_n_samples: 10                 # Extension number of samples
extension_point_distance: 2.0           # Extension point distance (m)
extension_min_resolution: 10            # Extension minimum resolution
extension_max_s_sample: 300             # Extension maximum s sample
additional_const_time_emergency: 0.5    # Additional constant time emergency (s)

# ========================================
# Behavior and Performance Parameters
# ========================================
max_deceleration_on_target_change: 5.0  # Max deceleration on target change (m/s²)
forward_backward_velocities: true       # Add forward/backward velocity profiles
samples_forward_backward: 3             # Number of forward/backward samples
forward_backward_min_scale: 0.85        # Min acceleration scale for forward/backward
forward_backward_max_scale: 0.95        # Max acceleration scale for forward/backward

# ========================================
# Interface Parameters
# ========================================
trajectory_len_controller: 50          # Trajectory length for controller
send_trajectory_in_3d: true            # Send trajectory in 3D coordinates

# ========================================
# Debug and Logging Parameters
# ========================================
logging_sp: false                       # Enable sampling planner logging
log_console_level: "INFO"               # Console log level
log_file_level: "DEBUG"                 # File log level

# Planning behavior
lookahead: 15.0              # Lookahead distance for planning (m)
enable_obstacle_avoidance: true  # Enable dynamic obstacle avoidance
enable_overtaking: true      # Enable overtaking maneuvers

# ========================================
# Vehicle Parameters (from car_model.yaml)
# ========================================
vehicle_name: "f1tenth"         # Vehicle name identifier
track_name: "levine"            # Track name for racing
pitlane_name: "levine_pitlane"  # Pitlane name for pit entry/exit
gggv_mode: "diamond"            # GGGV mode (diamond/...)
gg_scale: 0.9                   # GG diagram scale factor

# Vehicle parameter overwrites
overwrite_vehicle_params: true  # Enable vehicle parameter overwrites
ax_machine_limit_overwrites: [8.0, 7.0, 7.0, 7.0, 6.0, 5.0, 4.0, 3.0, 2.0, 1.0]  # Acceleration limits per speed
gg_exponent_ax_pos: 1.0         # Positive acceleration exponent
gg_exponent_ax_neg: 1.0         # Negative acceleration exponent
ax_min_scale: 1.0               # Minimum acceleration scale
ax_max_scale: 1.0               # Maximum acceleration scale
ay_scale: 1.0                   # Lateral acceleration scale
Iz: 0.05797                     # Vehicle moment of inertia (kg*m²) from car_model.yaml

# Vehicle dynamics from car_model.yaml
m: 3.54                         # Vehicle mass (kg)
lf: 0.162                       # Distance from CG to front axle (m)
lr: 0.145                       # Distance from CG to rear axle (m)
wheelbase: 0.307                # Wheelbase (m)
h_cg: 0.014                     # Height of center of gravity (m)
a_max: 3.0                      # Maximum acceleration (m/s²)
a_min: -3.0                     # Maximum deceleration (m/s²)
v_max: 10.0                     # Maximum velocity (m/s)
v_min: -5.0                     # Minimum velocity (m/s)

# Vehicle dimensions (calculated from NUC2 specifications)
# Length: lr (0.145m) + wheelbase (0.307m) + front_overhang (~0.05m) = ~0.50m
# Width: Standard F1TENTH width = 0.20m
width: 0.20                     # Vehicle width (m) - F1TENTH standard *** MUST BE 0.20 NOT 0.30 ***
length: 0.50                    # Vehicle length (m) - calculated from wheelbase + overhangs

# Tire and drag parameters from car_model.yaml
C_0d: 0.48                      # Drag coefficient constant
C_d: -1.1                       # Drag coefficient
C_acc: 8.29                     # Acceleration coefficient
C_dec: 5.77                     # Deceleration coefficient
C_R: 2.03                       # Rolling resistance coefficient
C_0v: 100                       # Velocity coefficient constant
C_v: 20                         # Velocity coefficient

# Pacejka-specific tire/drag parameters (from NUC2_pacejka.yaml)
C_acc_pacejka: 0.35909931926497446      # Acceleration coefficient (Pacejka model)
C_dec_pacejka: 3.2                      # Deceleration coefficient (Pacejka model)
C_R_pacejka: 9.618150720869203          # Rolling resistance coefficient (Pacejka model)

# Pacejka tire model parameters (from NUC2_pacejka.yaml)
tire_model: "pacejka"           # Tire model type
mu: 1.0                         # Friction coefficient
C_Pf: [4.798521440254997, 2.1640281784621833, 0.6502296853018044, 0.3732212044732381]  # Pacejka front tire coefficients
C_Pr: [19.999999999999996, 1.4999999999999998, 0.6184183350099146, 1.1322308905491715e-16]  # Pacejka rear tire coefficients

# Steering parameters from car_model.yaml
tau_steer: 0.15779476           # Steering time constant (s)
max_steering_angle: 0.4189      # Maximum steering angle (rad) - ~24 degrees
max_steering_velocity: 3.2      # Maximum steering velocity (rad/s)

# Additional behavior parameters
hybrid_long_sampling: true      # Enable hybrid longitudinal sampling
sampling_mode: "spatial"        # Sampling mode (spatial/temporal)
V_thr_stillstand: 2.0           # Velocity threshold for stillstand (m/s)
perception_offset_threshold: 2.0  # Perception offset threshold
relative_long_sampling_threshold: 0.7  # Relative longitudinal sampling threshold
following_distance_factor_pos: 100.0   # Following distance factor positive
following_distance_factor_neg: 40.0    # Following distance factor negative
