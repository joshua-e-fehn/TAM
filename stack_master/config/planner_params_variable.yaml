# Planner Parameters Variable Definition
# This file defines all tunable parameters for spliner and predictive_spliner planners
# with their default, minimum, and maximum values for test run generation

# =============================================================================
# SPLINER PLANNER PARAMETERS
# =============================================================================
spliner:
  # Evasion behavior parameters
  evasion_dist:
    description: "Orthogonal distance of the apex to the obstacle"
    default: 0.6
    min: 0.25
    max: 1.25
    unit: "meters"
  
  obs_traj_tresh:
    description: "Threshold of the obstacle towards raceline to be considered for evasion"
    default: 1.0
    min: 0.1
    max: 1.5
    unit: "meters"
  
  spline_bound_mindist:
    description: "Splines may never be closer to the track bounds than this param in meters"
    default: 0.30
    min: 0.05
    max: 1.0
    unit: "meters"
  
  # Apex distance parameters (pre-apex)
  pre_apex_dist0:
    description: "First distance infront of the apex in meters"
    default: 4.0
    min: 0.5
    max: 8.0
    unit: "meters"
  
  pre_apex_dist1:
    description: "Second distance infront of the apex in meters"
    default: 3.0
    min: 0.5
    max: 8.0
    unit: "meters"
  
  pre_apex_dist2:
    description: "Third distance infront of the apex in meters"
    default: 2.0
    min: 0.5
    max: 8.0
    unit: "meters"
  
  # Apex distance parameters (post-apex)
  post_apex_dist0:
    description: "First distance after of the apex in meters"
    default: 4.5
    min: 0.5
    max: 12.0
    unit: "meters"
  
  post_apex_dist1:
    description: "Second distance after of the apex in meters"
    default: 5.0
    min: 0.5
    max: 12.0
    unit: "meters"
  
  post_apex_dist2:
    description: "Third distance after of the apex in meters"
    default: 5.5
    min: 0.5
    max: 12.0
    unit: "meters"
  
  # Prediction parameters
  kd_obs_pred:
    description: "Controls how fast the opponent is assumed to go back to our raceline"
    default: 1.0
    min: 0.1
    max: 10.0
    unit: "dimensionless"
  
  fixed_pred_time:
    description: "Fixed prediciton time for the opponent"
    default: 0.15
    min: 0.0
    max: 1.0
    unit: "seconds"

# =============================================================================
# PREDICTIVE SPLINER PARAMETERS
# =============================================================================
predictive_spliner:
  # Collision avoidance parameters
  n_time_steps:
    description: "Number of time steps for prediction"
    default: 400
    min: 10
    max: 500
    unit: "steps"
  
  dt:
    description: "Time step for prediction"
    default: 0.02
    min: 0.01
    max: 0.1
    unit: "seconds"
  
  save_distance_front:
    description: "Length of car in the front plus margin for safety"
    default: 0.6
    min: 0.1
    max: 1.0
    unit: "meters"
  
  save_distance_back:
    description: "Length of car in the back plus margin for safety"
    default: 0.6
    min: 0.1
    max: 1.0
    unit: "meters"
  
  # Velocity and acceleration limits
  max_v:
    description: "Maximum velocity of the car"
    default: 10.0
    min: 5.0
    max: 15.0
    unit: "m/s"
  
  min_v:
    description: "Minimum velocity of the car"
    default: 0.0
    min: 0.0
    max: 5.0
    unit: "m/s"
  
  max_a:
    description: "Maximum acceleration of the car"
    default: 7.0
    min: 4.0
    max: 20.0
    unit: "m/s²"
  
  min_a:
    description: "Minimum acceleration of the car"
    default: 5.0
    min: 1.0
    max: 7.0
    unit: "m/s²"
  
  # Other collision parameters
  max_expire_counter:
    description: "Maximum n of iterations until collision info gets deleted"
    default: 10
    min: 0
    max: 20
    unit: "iterations"
  
  # Update and offset parameters
  update_waypoints:
    description: "Update waypoints"
    default: true
    type: "boolean"
  
  speed_offset:
    description: "Add speed offset"
    default: 0.0
    min: -1.0
    max: 1.0
    unit: "m/s"
  
  # SQP-specific parameters
  evasion_dist_sqp:
    description: "Orthogonal distance of the apex to the obstacle (SQP)"
    default: 0.35
    min: 0.0
    max: 1.25
    unit: "meters"
  
  obs_traj_tresh_sqp:
    description: "Threshold of the obstacle towards raceline to be considered for evasion (SQP)"
    default: 1.5
    min: 0.1
    max: 2.0
    unit: "meters"
  
  spline_bound_mindist_sqp:
    description: "Splines may never be closer to the track bounds than this param in meters (SQP)"
    default: 0.20
    min: 0.05
    max: 1.0
    unit: "meters"
  
  lookahead_dist:
    description: "Lookahead distance in meters"
    default: 15.0
    min: 1.0
    max: 50.0
    unit: "meters"
  
  avoidance_resolution:
    description: "Number of points used to generate avoidance path"
    default: 30
    min: 10
    max: 100
    unit: "points"
  
  back_to_raceline_before:
    description: "Distance in meters before obstacle to stay on the raceline"
    default: 6.0
    min: 0.5
    max: 10.0
    unit: "meters"
  
  back_to_raceline_after:
    description: "Distance in meters after obstacle to go back on the raceline"
    default: 8.0
    min: 0.5
    max: 10.0
    unit: "meters"
  
  avoid_static_obs:
    description: "Avoid static obstacles"
    default: false
    type: "boolean"
