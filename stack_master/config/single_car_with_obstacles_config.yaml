# Single Car with Obstacles Test Run Configurations
# This file contains test configurations for spliner and predictive_spliner planners
# Parameters are sampled at different rates based on their importance for obstacle avoidance
#
# Naming schema: {planner_name}_{param_name}
# 
# Parameter importance categories:
# - HIGH: Critical safety/performance params - sampled at min, default, max, and mid-points
# - MEDIUM: Important tuning params - sampled at min, default, max
# - LOW: Fine-tuning params - sampled at default and extremes

